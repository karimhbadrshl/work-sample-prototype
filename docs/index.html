<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fault-finding prototype</title>
<link rel="icon" href="data:," />
<style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Rubik:wght@400;500&display=swap');</style>
<style>
:root {
  --ground: #F2EFE6; --raised: #FBFAF6; --ink: #22252B; --muted: #62666E; --yellow: #B07A0C; --yellow-text: #8A5F07;
  --blue: #2F5DA8; --red: #B8392C; --stud: #B9B2A2; --hair: #D9D4C7;
  --sans: Rubik, "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 14px 18px 28px; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
h1 { font-size: 24px; font-weight: 500; margin: 4px 0 2px; }
h2 { font-size: 16px; font-weight: 500; margin: 0 0 6px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--hair); padding-bottom: 10px; }
.hud { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
.chip { border: 1px solid var(--hair); background: var(--raised); border-radius: 6px; padding: 4px 10px; }
.chip b { font-weight: 500; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; margin-top: 14px; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--raised); border: 1px solid var(--hair); border-radius: 8px; padding: 12px; }
.scene { padding: 6px; }
svg { display: block; }
.scene svg { width: 100%; height: auto; }
.btn { border: 1px solid var(--ink); background: var(--raised); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover { background: #fff; }
.btn.primary { background: var(--ink); color: var(--raised); }
.btn.primary:hover { background: #3a3e46; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-top: 10px; }
.tool { border: 1px solid var(--hair); background: var(--raised); border-radius: 6px; padding: 7px 12px; cursor: pointer; text-align: left; min-width: 128px; }
.tool small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.tool[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: #fff; }
.readout { flex: 1; min-width: 220px; border: 1px solid var(--ink); border-radius: 6px; background: var(--ink); color: var(--raised); padding: 6px 12px; font-family: var(--mono); }
.readout .big { font-size: 22px; letter-spacing: .02em; }
.readout .sub { font-size: 12px; opacity: .8; }
.status { margin-top: 8px; min-height: 22px; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); margin: -4px 0 10px; }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.pane { height: 330px; overflow: auto; }
.msg { margin: 0 0 8px; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
.msg.you { background: #fff; border: 1px solid var(--hair); }
.msg.ai { background: var(--ground); border: 1px solid var(--hair); }
.msg .who { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 2px; }
.askrow { display: flex; gap: 8px; margin-top: 8px; }
.askrow input { flex: 1; border: 1px solid var(--hair); border-radius: 6px; padding: 7px 10px; background: #fff; }
details.g { border-bottom: 1px solid var(--hair); padding: 6px 0; }
details.g summary { cursor: pointer; font-weight: 500; }
details.g p { margin: 6px 0 2px; color: var(--muted); font-size: 14px; }
.nb { font-size: 13px; font-family: var(--mono); margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px dashed var(--hair); }
.nb .n { color: var(--muted); }
.dx { margin-top: 12px; }
.dx label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 3px; }
.dx select, .dx input[type=text] { width: 100%; border: 1px solid var(--hair); border-radius: 6px; padding: 7px 10px; background: #fff; }
.tag { font-family: var(--mono); font-size: 12px; padding: 1px 7px; border: 1px solid var(--hair); border-radius: 4px; color: var(--muted); margin-right: 6px; display: inline-block; }
.tag.flag { border-color: var(--red); color: var(--red); }
.overlay { position: fixed; inset: 0; background: rgba(34,37,43,.55); display: flex; align-items: flex-start; justify-content: center; padding: 28px 14px; overflow: auto; z-index: 10; }
.modal { background: var(--raised); border: 1px solid var(--hair); border-radius: 10px; padding: 22px 26px; width: min(760px, 100%); }
.modal h1 { margin-top: 8px; }
.modal ul { padding-left: 20px; margin: 8px 0; }
.score { font-family: var(--mono); font-size: 56px; color: var(--yellow); line-height: 1; margin: 8px 0 2px; }
.score small { font-size: 20px; color: var(--muted); }
.row { display: grid; grid-template-columns: 150px 1fr 56px; gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
.bar { height: 10px; background: var(--hair); border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 6px; }
table.t th, table.t td { border-bottom: 1px solid var(--hair); text-align: left; padding: 4px 6px; font-weight: 400; }
table.t th { color: var(--muted); font-family: var(--mono); font-size: 11px; text-transform: uppercase; }
.studs { margin-top: 18px; }
/* scene */
.part { cursor: pointer; }
.part:hover .box { stroke: var(--ink); }
.box { fill: var(--raised); stroke: var(--stud); stroke-width: 1.5; }
.part.sel .box { stroke: var(--blue); stroke-width: 3; }
.tg { font-family: var(--mono); font-size: 15px; font-weight: 500; fill: var(--ink); }
.nm { font-family: var(--sans); font-size: 11px; fill: var(--muted); }
.st { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.wire { fill: none; stroke: var(--stud); stroke-width: 3; stroke-linejoin: round; }
.zone { fill: none; stroke: var(--hair); stroke-width: 1.5; stroke-dasharray: 5 5; }
.zt { font-family: var(--mono); font-size: 11px; fill: var(--muted); letter-spacing: .06em; }
.lamp-on { fill: var(--blue); } .lamp-dim { fill: var(--blue); opacity: .35; } .lamp-off { fill: var(--raised); }
.lamp { stroke: var(--ink); stroke-width: 1.5; }
.spin { transform-box: fill-box; transform-origin: center; }
.running .spin { animation: spin 1s linear infinite; }
.humming .spin { animation: shake .12s linear infinite; }
.belt { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 10 8; }
.running .belt, .running .flow { animation: dash .8s linear infinite; }
.crate { fill: var(--stud); stroke: var(--ink); }
.running .crates { animation: slide 5s linear infinite; }
.flow { stroke: var(--blue); stroke-width: 4; stroke-dasharray: 8 8; fill: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake { 0%, 100% { transform: translate(-1.5px, 0); } 50% { transform: translate(1.5px, 1px); } }
@keyframes dash { to { stroke-dashoffset: -18; } }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(260px); } }
@media (prefers-reduced-motion: reduce) { .running .spin, .humming .spin, .running .belt, .running .flow, .running .crates { animation: none; } }

.coach { margin-top: 12px; border: 1px solid var(--ink); border-left-width: 6px; background: var(--raised); border-radius: 8px; padding: 10px 16px; }
.coach h2 { margin: 4px 0 2px; }
.coach p { margin: 2px 0 4px; }
.coach .kicker { justify-content: space-between; }
.link { border: 0; background: none; text-decoration: underline; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 12px; }
.part.hl .box { stroke: var(--blue); stroke-width: 4; animation: pulse 1.2s ease-in-out infinite; }
.tool.hl, #q.hl, #dxsel.hl { outline: 3px solid var(--blue); outline-offset: 2px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .part.hl .box, .tool.hl, #q.hl, #dxsel.hl { animation: none; } }
.coachnav { display: flex; gap: 8px; margin: 6px 0 2px; }
.coachnav .btn { padding: 4px 14px; }

</style>
</head>
<body>
<div id="app"></div>
<noscript>This prototype needs JavaScript.</noscript>
<!-- Generated by tools/build_game.py from game/. Do not edit by hand. -->
<script>
/* Fault-finding engine: system model, fault generator, tests, scoring, AI-mentor mock, integrity flags.
   Pure logic, no DOM. The browser page and the Node evaluation (game/eval.js) use this same file. */
(function (root) {
  'use strict';

  // Supply tree: each node's output depends on its parent. Single fault per form.
  const NODES = [
    { id: 'MAINS', parent: null, kind: 'source', name: 'Mains inlet' },
    { id: 'Q1', parent: 'MAINS', kind: 'isolator', name: 'Isolator', gate: 'Q1' },
    { id: 'F1', parent: 'Q1', kind: 'fuse', name: 'Fuse', modes: ['open'] },
    { id: 'PSU', parent: 'F1', kind: 'psu', name: 'Power supply', modes: ['open', 'low'] },
    { id: 'S1', parent: 'PSU', kind: 'estop', name: 'Emergency stop', gate: 'S1', modes: ['open'] },
    { id: 'K1', parent: 'S1', kind: 'relay', name: 'Safety relay', modes: ['open'] },
    { id: 'SW1', parent: 'K1', kind: 'toggle', name: 'Conveyor enable switch', gate: 'SW1', modes: ['open'] },
    { id: 'KM1', parent: 'SW1', kind: 'contactor', name: 'Conveyor contactor', modes: ['open'] },
    { id: 'M1', parent: 'KM1', kind: 'motor', name: 'Conveyor motor', modes: ['open', 'seized'] },
    { id: 'SW2', parent: 'K1', kind: 'toggle', name: 'Pump enable switch', gate: 'SW2', modes: ['open'] },
    { id: 'KM2', parent: 'SW2', kind: 'contactor', name: 'Pump contactor', modes: ['open'] },
    { id: 'M2', parent: 'KM2', kind: 'motor', name: 'Pump motor', modes: ['open', 'seized'] },
  ];
  const BY_ID = Object.fromEntries(NODES.map((n) => [n.id, n]));
  const HYPS = [];
  NODES.forEach((n) => (n.modes || []).forEach((m) => HYPS.push({ id: n.id, mode: m })));
  const FAULTABLE = NODES.filter((n) => n.modes).map((n) => n.id);
  const COST = { V: 1, I: 1, SWAP: 3 };
  const INITIAL = { Q1: true, S1: true, SW1: false, SW2: false }; // S1 true = released
  const ALL_ON = { Q1: true, S1: true, SW1: true, SW2: true };
  const PULL_IN = 20; // volts: relays and contactors drop out below this

  function solve(state, fault) {
    const out = {};
    for (const n of NODES) {
      const vin = n.parent === null ? 230 : out[n.parent].v;
      const f = fault && fault.id === n.id ? fault.mode : null;
      let v = vin, i = 0, run = false, hum = false;
      if (n.kind === 'source') v = 230;
      if (n.gate && !state[n.gate]) v = 0;
      if (f === 'open' && n.kind !== 'motor') v = 0;
      if (n.kind === 'psu') v = vin >= 100 && f !== 'open' ? (f === 'low' ? 17 : 24) : 0;
      if ((n.kind === 'relay' || n.kind === 'contactor') && vin < PULL_IN) v = 0;
      if (n.kind === 'motor') {
        v = vin;
        const powered = v >= PULL_IN;
        run = powered && f === null;
        hum = powered && f === 'seized';
        i = powered ? (f === 'seized' ? 9.8 : f === 'open' ? 0 : 2.1) : 0;
      }
      out[n.id] = { v, i, run, hum };
    }
    return out;
  }

  // Free observations: what the candidate can see and hear without spending test budget.
  function observe(state, fault) {
    const o = solve(state, fault);
    const motor = (m) => (m.hum ? 'humming' : m.run ? 'running' : 'stopped');
    return { H1: o.PSU.v >= PULL_IN ? 'on' : o.PSU.v > 0 ? 'dim' : 'off', H2: o.K1.v >= PULL_IN ? 'on' : 'off', M1: motor(o.M1), M2: motor(o.M2) };
  }

  // Paid tests. A test is {type:'V'|'I'|'SWAP', node}.
  function measure(test, state, fault) {
    const o = solve(state, fault);
    if (test.type === 'V') return String(o[test.node].v);
    if (test.type === 'I') return String(o[test.node].i);
    return fault && fault.id === test.node ? 'fixed' : 'nochange';
  }
  function allTests() {
    const t = [];
    NODES.forEach((n) => { if (n.kind !== 'source') t.push({ type: 'V', node: n.id }); });
    ['M1', 'M2'].forEach((m) => t.push({ type: 'I', node: m }));
    FAULTABLE.forEach((id) => t.push({ type: 'SWAP', node: id }));
    return t;
  }
  const TESTS = allTests();
  const sig = (o) => JSON.stringify(o);

  function consistent(h, rec) {
    return rec.kind === 'obs' ? sig(observe(rec.state, h)) === sig(rec.result) : measure(rec.test, rec.state, h) === rec.result;
  }
  const comps = (hs) => new Set(hs.map((h) => h.id));

  // Reference policy: minimax test cost to isolate one component from state ALL_ON (the "efficient technician").
  const memo = new Map();
  function opt(hs) {
    if (comps(hs).size <= 1) return { cost: 0, test: null };
    const key = hs.map((h) => h.id + h.mode).sort().join('|');
    if (memo.has(key)) return memo.get(key);
    let best = { cost: Infinity, test: null };
    for (const t of TESTS) {
      const parts = new Map();
      hs.forEach((h) => { const r = measure(t, ALL_ON, h); (parts.get(r) || parts.set(r, []).get(r)).push(h); });
      if (parts.size === 1) continue;
      let worst = 0;
      parts.forEach((p) => { worst = Math.max(worst, opt(p).cost); });
      const c = COST[t.type] + worst;
      if (c < best.cost) best = { cost: c, test: t };
    }
    memo.set(key, best);
    return best;
  }
  // Hypotheses left after the free look at ALL_ON for a given true fault.
  function afterFreeLook(fault) {
    const r = sig(observe(ALL_ON, fault));
    return HYPS.filter((h) => sig(observe(ALL_ON, h)) === r);
  }
  function policyPath(fault) {
    let hs = afterFreeLook(fault), cost = 0;
    const steps = [];
    while (comps(hs).size > 1) {
      const { test } = opt(hs);
      if (!test) break;
      const r = measure(test, ALL_ON, fault);
      cost += COST[test.type]; steps.push(test);
      hs = hs.filter((h) => measure(test, ALL_ON, h) === r);
    }
    return { cost, steps };
  }

  // ---- Form generator: a seed gives one fault and its own part labels, so there is no shared answer key.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function generate(seed, forceFault) {
    const rnd = mulberry32(seed >>> 0);
    const fault = forceFault || HYPS[Math.floor(rnd() * HYPS.length)];
    const o = Math.floor(rnd() * 4);
    const tags = { MAINS: 'Mains', Q1: 'Q1', F1: 'F' + (1 + o), PSU: 'PSU1', S1: 'S' + (1 + o), K1: 'K' + (1 + o), SW1: 'SW' + (1 + o), SW2: 'SW' + (2 + o), KM1: 'KM' + (1 + o), KM2: 'KM' + (2 + o), M1: 'M' + (1 + o), M2: 'M' + (2 + o) };
    return { seed, formId: 'FF-' + (seed >>> 0).toString(36).toUpperCase().padStart(4, '0'), fault, tags };
  }
  const label = (form, id) => `${BY_ID[id].name} ${form.tags[id]}`;

  // ---- AI mentor (mock). It is given the guide and the question only, never the fault: it cannot leak what it does not know.
  function guide(tags) {
    const T = tags;
    const L = (name, tag) => `${name} ${tag}`;
    return [
      { id: 'method', keys: ['method', 'approach', 'strategy', 'where', 'start', 'how do i', 'how to', 'begin', 'stuck', 'help'],
        title: 'Method', text: 'Work from what you can see to what you can measure. Each test narrows where the fault can be. A reading at a point in the supply chain tells you whether the fault is upstream or downstream of it, so a test near the middle of the remaining chain rules out more than one at the ends. Free observations (lamps, motors) cost nothing; meter readings cost 1, a spare swap costs 3.' },
      { id: 'meter', keys: ['meter', 'voltmeter', 'measure', 'probe', 'clamp', 'ammeter', 'amps', 'current', 'reading', 'tool'],
        title: 'Using the meters', text: `Voltmeter: pick it, then click any part to read the voltage at its output terminal (mains side is AC, everything after ${T.PSU} is 24 V DC). Clamp ammeter: works on the motor leads only. A switch that is off or an engaged emergency stop gives 0 V by design, so check switch positions before you read anything.` },
      { id: 'lamps', keys: ['lamp', 'light', 'h1', 'h2', 'indicator', 'led'],
        title: 'Indicator lamps', text: `H1 shows the ${T.PSU} output: lit at 20 V or more, dim between 0 and 20 V, dark at 0 V. H2 shows the ${T.K1} output: lit only when the relay has pulled in. A lamp tells you the voltage at one point only.` },
      { id: 'swap', keys: ['swap', 'spare', 'replace', 'change part'],
        title: 'Spare parts', text: 'A known-good spare can be swapped into any part except the isolator and the enable switches you can already operate. It costs 3 and tells you only whether that one part was the cause. It is a confirmation tool, not a search tool.' },
      { id: 'safety', keys: ['safe', 'safety', 'lockout', 'danger', 'shock'],
        title: 'Safety', text: 'On site you would lock out and verify dead before touching anything. In this simulator you may probe live parts.' },
      { id: 'hum', keys: ['hum', 'noise', 'sound', 'buzz', 'smell'],
        title: 'Motor sounds', text: 'A motor with power at its terminals that hums but does not turn is mechanically stuck. A motor with power and no sound and no current has an open winding or lead.' },
      { id: 'Q1', keys: [T.Q1.toLowerCase(), 'isolator', 'disconnect'], title: L('Isolator', T.Q1), text: 'Manual isolator. ON: 230 V AC passes. OFF: 0 V downstream. Off is not a fault.' },
      { id: 'F1', keys: [T.F1.toLowerCase(), 'fuse'], title: L('Fuse', T.F1), text: `6.3 A slow-blow fuse. Healthy: 230 V AC at its output with ${T.Q1} on. A blown fuse passes no voltage.` },
      { id: 'PSU', keys: [T.PSU.toLowerCase(), 'psu', 'power supply', 'transformer'], title: L('Power supply', T.PSU), text: '230 V AC in, 24 V DC out. Healthy output 21.6 to 26.4 V. Relays and contactors need 20 V or more to pull in, so a supply that sags below 20 V can look like a dead relay downstream.' },
      { id: 'S1', keys: [T.S1.toLowerCase(), 'estop', 'e-stop', 'emergency'], title: L('Emergency stop', T.S1), text: 'Normally-closed mushroom button. Released: 24 V passes. Pressed in: 0 V downstream, which is a normal state, not a fault. Twist to release.' },
      { id: 'K1', keys: [T.K1.toLowerCase(), 'relay', 'safety relay'], title: L('Safety relay', T.K1), text: 'Pulls in when its input is 20 V or more and the emergency stop is released. Healthy output equals its input (24 V). H2 shows its output.' },
      { id: 'SW1', keys: [T.SW1.toLowerCase(), 'conveyor enable', 'enable switch'], title: L('Conveyor enable switch', T.SW1), text: 'Toggle that passes 24 V to the conveyor contactor when ON.' },
      { id: 'SW2', keys: [T.SW2.toLowerCase(), 'pump enable'], title: L('Pump enable switch', T.SW2), text: 'Toggle that passes 24 V to the pump contactor when ON.' },
      { id: 'KM1', keys: [T.KM1.toLowerCase(), 'conveyor contactor', 'contactor'], title: L('Conveyor contactor', T.KM1), text: 'Pulls in at 20 V or more at its coil feed and passes 24 V to the conveyor motor.' },
      { id: 'KM2', keys: [T.KM2.toLowerCase(), 'pump contactor'], title: L('Pump contactor', T.KM2), text: 'Pulls in at 20 V or more at its coil feed and passes 24 V to the pump motor.' },
      { id: 'M1', keys: [T.M1.toLowerCase(), 'conveyor motor', 'conveyor', 'motor'], title: L('Conveyor motor', T.M1), text: '24 V DC motor. Healthy: 24 V at terminals, 2.1 A run current, turns. Seized rotor: 24 V at terminals, about 9.8 A, hums. Open winding: 24 V at terminals, 0 A.' },
      { id: 'M2', keys: [T.M2.toLowerCase(), 'pump motor', 'pump'], title: L('Pump motor', T.M2), text: '24 V DC motor, same ratings as the conveyor motor: 2.1 A run current when healthy, about 9.8 A seized, 0 A with an open winding.' },
    ];
  }

  const RX_INJECT = /ignore (all|any|previous|prior|your)|system prompt|you are now|pretend|developer mode|jailbreak|reveal (your|the) (prompt|instructions)/i;
  const RX_VERDICT = /\b(which|what)\b[^?]*\b(faulty|broken|failed|failing|dead|bad|culprit|fault|problem|cause|wrong)\b|\bis\b[^?]*\b(faulty|broken|failed|dead|bad|blown|healthy|okay|ok|working|good|the fault|the cause|the problem)\b|\b(tell|give|show) me (the )?(answer|fault|solution)|\bjust tell\b|\bam i right\b|\bis it\b|\bwhich (part|component|one)\b[^?]*\b(swap|replace|change|fix|check|test|look)/i;
  const RX_SPEC = /\b(expected|normal|nominal|spec|specification|rating|should (read|be)|healthy (value|reading|voltage|current))\b/i;

  function mentor(question, tags) {
    const q = String(question || '').trim();
    if (!q) return { intent: 'empty', flag: null, text: 'Ask about a part, a meter, a lamp, or how to approach the fault.' };
    if (RX_INJECT.test(q)) return { intent: 'injection', flag: 'mentor_injection_attempt', text: 'I only help with this cell: parts, meters, lamps and method. I cannot change my instructions.' };
    if (RX_VERDICT.test(q) && !RX_SPEC.test(q)) return { intent: 'verdict', flag: 'mentor_answer_seeking', text: `I cannot say which part is at fault or confirm a guess; that is the task. I can tell you what a healthy part reads, how the meters work, or how to narrow down a fault. Try asking, for example, what the fuse ${tags.F1} should read.` };
    const ql = q.toLowerCase();
    let best = null, bestScore = 0;
    for (const g of guide(tags)) {

    tut.i = i;
    el.hidden = false;
    const nav = (back, fwd) => `<p class="coachnav">${back ? '<button class="btn" id="prevStep">Previous<\/button>' : ''}${fwd ? '<button class="btn primary" id="nextStep">Next<\/button>' : ''}<\/p>`;
    if (i >= list.length) { el.innerHTML = '<div class="kicker"><span>Practice complete<\/span><\/div><p>Well done. That is all there is to it.<\/p>' + nav(true, false); }
    else {
      const st = list[i], past = tut.pin !== null;
      el.innerHTML = `<div class="kicker"><span>Guided practice · step ${i + 1} of ${list.length}<\/span><button class="link" id="skipTut">Skip the practice<\/button><\/div><h2>${esc(st.h)}<\/h2><p>${esc(st.t)}<\/p>${past ? '<p class="muted">You have already done this step. Press Next to carry on, or just keep going.<\/p>' : ''}${nav(i > 0, past)}`;
      const target = document.querySelector(st.hl); if (target) target.classList.add('hl');
    }
    if ($('#skipTut')) $('#skipTut').onclick = () => { tut = null; startReal(); };
    if ($('#prevStep')) $('#prevStep').onclick = () => { tut.pin = i - 1; coach(); };
    if ($('#nextStep')) $('#nextStep').onclick = () => { tut.pin = i + 1 >= far ? null : i + 1; coach(); };
  }

  function submitFlow() {
    const v = $('#dxsel').value;
    if (!v) { $('#confirmNote').textContent = 'Choose a part first.'; return; }
    if (!$('#submit').dataset.arm) { $('#submit').dataset.arm = '1'; $('#submit').textContent = 'Confirm: this is final'; $('#confirmNote').textContent = `You are naming ${L(v)}.`; return; }
    finish(v);
  }

  function finish(id) {
    const practice = !!tut;
    const r = S.submit(id, $('#why').value);
    const label = (n) => `${esc(L(n))}`;
    const rows = [['Accuracy', r.parts.accuracy, 50], ['Efficiency', r.parts.efficiency, 30], ['No wasted tests', r.parts.redundancy, 10], ['Fits the evidence', r.parts.consistency, 10]];
    const verdict = r.correct ? (r.justified ? 'Your evidence pointed to one part, and you named it.' : 'Right part, but your tests had not yet ruled out the others, so credit is halved. A lucky guess scores less than a diagnosis.') : 'That was not the failed part.';
    const flags = r.flags.length ? r.flags.map((f) => `<span class="tag flag">Flag: ${esc(f.replace(/_/g, ' '))}<\/span>`).join(' ') : '<span class="tag">No flags<\/span>';
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = `<div class="modal"><div class="kicker">${BRICK}<span>${practice ? 'Practice result' : 'Result · form ' + esc(form.formId)}<\/span><\/div>
      <div class="score" aria-label="Score ${r.total} out of 100">${r.total}<small> / 100<\/small><\/div><p>${verdict}<\/p>
      <p><b>The fault was ${label(form.fault.id)}: ${MODE_TEXT[form.fault.mode]}.<\/b> You named ${label(id)}.<\/p>
      ${rows.map(([n, v, m]) => `<div class="row"><span>${n}<\/span><div class="bar"><i style="width:${(100 * v) / m}%"><\/i><\/div><span class="mono">${v}/${m}<\/span><\/div>`).join('')}
      <h2 style="margin-top:14px">Your path<\/h2>
      <table class="t"><tr><th>#<\/th><th>Action<\/th><th>Parts still possible<\/th><\/tr>${trace.map((t, i) => `<tr><td>${i + 1}<\/td><td>${esc(t.label)}<\/td><td class="mono">${t.n}<\/td><\/tr>`).join('') || '<tr><td colspan="3">No actions taken.<\/td><\/tr>'}<\/table>
      <p class="muted">Test cost ${r.cost}; an efficient route needs ${r.policyCost}. ${r.nTests} tests, ${r.redundant} told you nothing new.<\/p>
      ${practice ? `<h2>That was the practice<\/h2><p>Nicely done. The practice is not recorded and does not count. In the real task the fault is different and there are no hints, but the tools and the mentor work exactly the same way. Take your time.<\/p><p><button class="btn primary" id="again">Start the real task<\/button> <button class="btn" id="redo">Practise again<\/button><\/p><\/div>` : `<h2>Integrity record<\/h2><p>${flags}<\/p><p class="muted">${esc(r.review)}. Flags are prompts for a person to look at the record. They are not a verdict and never reject anyone automatically.<\/p>
      <p><button class="btn primary" id="again">Try another form<\/button> <button class="btn" id="dl">Download session record<\/button> <button class="btn" id="close">Close<\/button><\/p><\/div>`}`;
    document.body.appendChild(ov);
    $('#again', ov).onclick = () => { ov.remove(); if (practice) { tut = null; startReal(); } else start(Math.floor(Math.random() * 1e9)); };
    if (practice) $('#redo', ov).onclick = () => { ov.remove(); startPractice(); };
    if (!practice) { $('#close', ov).onclick = () => ov.remove();
    $('#dl', ov).onclick = () => { const b = new Blob([JSON.stringify({ form: form.formId, result: r, log: S.log, events: S.events }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `session-${form.formId}.json`; a.click(); }; }
    $('#again', ov).focus();
  }

  function welcome() {
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'brief'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = `<div class="modal"><div class="kicker">${BRICK}<span>Field service · fault-finding · prototype<\/span><\/div><h1>Welcome. Let's find a fault together.<\/h1>
      <p>You are a maintenance technician and packaging cell 3 has stopped. Your job is to work out which part has failed, using as few tests as you sensibly can. There are no trick questions, and using the reference guide and the AI mentor is part of the job.<\/p>
      <p>We will start with a short guided practice on a different fault. It takes about three minutes, shows you each tool in turn, and is not recorded or scored.<\/p>
      <p class="muted">There is no visible countdown, and you can use the keyboard throughout (Tab, Enter). <b>What is recorded in the real task:<\/b> your switch settings, tests, mentor questions and timings, and whether you leave this window, copy text or paste into a field. A person reviews these only if something looks unusual. No one is rejected automatically.<\/p>
      <p><button class="btn primary" id="go">Start the guided practice<\/button> <button class="btn" id="skip">Skip to the real task<\/button><\/p><\/div>`;
    document.body.appendChild(ov);
    $('#go', ov).onclick = () => { ov.remove(); startPractice(); };
    $('#skip', ov).onclick = () => { ov.remove(); };
    $('#go', ov).focus();
  }

  function start(seed, force, practice) {
    const q = new URLSearchParams(location.search);
    let f = force;
    if (!f && q.get('fault')) { const [id, mode] = q.get('fault').split(':'); f = { id, mode }; }
    form = E.generate(seed, f); S = E.createSession(form); tut = practice ? { i: 0, pin: null } : null; trace = []; selected = null; pendingSwap = null; tool = 'hand';
    mount();
    document.querySelectorAll('.overlay').forEach((o) => { if (o.id !== 'brief') o.remove(); });
    say(practice ? 'Practice: follow the steps above.' : 'Start by switching the conveyor and pump on with the hand tool.');
    coach();
    window.__session = S;
  }
  const seedParam = new URLSearchParams(location.search).get('seed');
  const realSeed = seedParam ? Number(seedParam) : Math.floor(Math.random() * 1e9);
  const startReal = () => start(realSeed);
  const startPractice = () => start(11, { id: 'KM1', mode: 'open' }, true);
  startReal();
  welcome();
})();

</script>
</body>
</html>
